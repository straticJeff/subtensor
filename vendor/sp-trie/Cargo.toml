[package]
name = "sp-trie"
version = "40.0.0"
authors = ["Parity Technologies <admin@parity.io>"]
description = "Patricia trie stuff using a parity-scale-codec node format"
repository = "https://github.com/paritytech/polkadot-sdk"
license = "Apache-2.0"
edition = "2021"
homepage = "https://substrate.io"
documentation = "https://docs.rs/sp-trie"
readme = "README.md"


[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]


[dependencies]
ahash = { version = "0.8.2", optional = true }
codec = { version = "3.7.5", package = "parity-scale-codec"  , default-features = false }
foldhash = { version = "0.1.5"  , default-features = false }
hash-db = { version = "0.16.0"  , default-features = false }
hashbrown = { version = "0.15.3"  }
memory-db = { version = "0.34.0"  , default-features = false }
nohash-hasher = { version = "0.2.0", optional = true }
parking_lot = { version = "0.12.1", optional = true, default-features = true }
prometheus-endpoint = { git = "https://github.com/RaoFoundation/polkadot-sdk.git", rev = "cacb4310f20c7cac83eb3ccd8ed5a5ad4212608a", optional = true, default-features = true, package = "substrate-prometheus-endpoint" }
rand = { version = "0.8.5", optional = true, default-features = true }
scale-info = { version = "2.11.6", features = ["derive"] , default-features = false }
schnellru = { version = "0.2.3", optional = true }
sp-core = { git = "https://github.com/RaoFoundation/polkadot-sdk.git", rev = "cacb4310f20c7cac83eb3ccd8ed5a5ad4212608a" , default-features = false }
sp-externalities = { git = "https://github.com/RaoFoundation/polkadot-sdk.git", rev = "cacb4310f20c7cac83eb3ccd8ed5a5ad4212608a" , default-features = false }
thiserror = { version = "1.0.64", optional = true }
tracing = { version = "0.1.37", optional = true, default-features = true }
trie-db = { version = "0.30.0"  , default-features = false }
trie-root = { version = "0.18.0"  , default-features = false }


[features]
default = ["std"]
std = [
	"ahash",
	"codec/std",
	"foldhash/std",
	"hash-db/std",
	"memory-db/std",
	"nohash-hasher",
	"parking_lot",
	"prometheus-endpoint",
	"rand",
	"scale-info/std",
	"schnellru",
	"sp-core/std",
	"sp-externalities/std",
	"thiserror",
	"tracing",
	"trie-db/std",
	"trie-root/std",
]
